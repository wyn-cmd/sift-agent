name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tests use fake models and fake Volatility runners, so no key or memory image is needed
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
